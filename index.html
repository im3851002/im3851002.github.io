<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 첫 페인트 전에 테마를 적용해 깜빡임을 막는다
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/markdown.css">
</head>
<body data-page="index">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="index.html">내 블로그</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="index.html">글</a>
        <button class="theme-toggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">글 목록</h1>
    <p class="page-intro">마크다운으로 쓴 글들을 모아 둡니다.</p>
    <ul class="tag-list" id="tag-list" aria-label="태그 필터"></ul>
    <ul class="post-list" id="post-list">
      <li class="status">불러오는 중…</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">© 내 블로그</div>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/router.js"></script>
</body>
</html>
